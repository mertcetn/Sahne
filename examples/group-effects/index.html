<link rel="stylesheet" href="style.css">
<span id="heading" class="heading">Sahne / effect coverage</span>
<span class="title" style="left:80px">Nested opacity: 0.5 x 0.5</span>
<div id="outer" class="outer">
  <div id="inner" class="inner">
    <div id="nestedRed" class="red"></div>
    <div id="nestedBlue" class="blue"></div>
  </div>
  <div id="badge" class="badge"></div>
</div>
<span class="title" style="left:620px">Scale: X 1.5 / Y 0.75</span>
<div id="scalePanel" class="scale-panel">
  <div id="stretched" class="stretched">
    <span id="stretchedText" class="stretched-text">Wide / short</span>
    <img id="stretchedImage" class="stretched-image" src="checker.png">
  </div>
  <span id="controlText" class="control-text">Wide / short</span>
</div>
<span class="title" style="left:1220px">Fractional clip / empty clip</span>
<div id="fractionPanel" class="fraction-panel">
  <div id="lowClip" class="low-clip"><div id="lowFill" class="fill"></div></div>
  <div id="highClip" class="high-clip"><div id="highFill" class="fill"></div></div>
  <div id="emptyClip" class="empty-clip"><div id="emptyFill" class="fill"></div></div>
  <span class="fraction-note">Edges: .25 / .75 / zero width</span>
</div>
