name: Check and release
on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - run: ./target/release/wallpaper-cli.exe --version
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: check
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: cargo build --workspace --release --locked
      - name: Package development artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          $name = "sahne-windows-x64-$env:GITHUB_SHA.zip"
          Compress-Archive -Path target/release/wallpaper-cli.exe,docs -DestinationPath "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content dist/SHA256SUMS.txt
      - name: Publish development prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-$env:GITHUB_SHA-run-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag dist/* --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Sahne development $env:GITHUB_SHA" --prerelease --notes "Development scaffold only. Wallpaper rendering and package execution are not implemented. See the bundled documentation."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
