[package]
name = "wallpaper-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
wallpaper-format = { path = "../wallpaper-format" }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
